
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub File Browser</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f6f8;
  margin: 25px;
}
.container {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 22px;
  border-radius: 9px;
}
h2 { border-bottom: 1px solid #ddd; padding-bottom: 14px; }
input {
  width: 95%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 5px;
}
.file {
  padding: 14px 5px;
  border-bottom: 1px solid #eee;
}
.file a {
  color: #0969da;
  text-decoration: none;
  overflow-wrap: anywhere;
}
.file a:hover { text-decoration: underline; }
.path {
  color: #777;
  font-size: 12px;
  margin-top: 5px;
  overflow-wrap: anywhere;
}
button {
  padding: 7px 12px;
  cursor: pointer;
  border: 1px solid #ccc;
  border-radius: 5px;
  background: #fff;
}
#status { margin: 15px 0; color: #555; }
</style>
</head>

<body>
<div class="container">

<h2>GitHub HTML File Browser</h2>

<input id="search" type="search"
placeholder="Search HTML files...">

<div id="status">Loading files...</div>
<div id="files"></div>

</div>

<script>
const owner = "raagkorla431-ux";
const repo = "my-post";
const branch = "main";

const params = new URLSearchParams(location.search);

const type = params.get("Type") || "File";
const connector = params.get("CONNECTOR") || "";
const requestId = params.get("GetFoldersAndFiles") || "";

let allFiles = [];

const status = document.getElementById("status");
const fileBox = document.getElementById("files");
const search = document.getElementById("search");

async function loadFiles() {
  try {
    const api =
      `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;

    const response = await fetch(api);

    if (!response.ok) {
      throw new Error("GitHub API: " + response.status);
    }

    const result = await response.json();

    if (result.truncated) {
      throw new Error("Repository tree was truncated.");
    }

    allFiles = result.tree.filter(item =>
      item.type === "blob" &&
      /\.(html?|HTML?)$/.test(item.path)
    );

    status.textContent =
      allFiles.length + " HTML files found.";

    renderFiles(allFiles);

  } catch (error) {
    status.textContent = error.message;
  }
}

function renderFiles(files) {
  fileBox.replaceChildren();

  if (!files.length) {
    status.textContent = "No matching HTML files found.";
    return;
  }

  files.forEach(file => {
    const row = document.createElement("div");
    row.className = "file";

    const link = document.createElement("a");

    const encodedPath = file.path
      .split("/")
      .map(encodeURIComponent)
      .join("/");

    link.href =
      `https://${owner}.github.io/${repo}/${encodedPath}`;

    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "📄 " + file.path;

    const path = document.createElement("div");
    path.className = "path";
    path.textContent = "Path: " + file.path;

    const copy = document.createElement("button");
    copy.textContent = "Copy URL";

    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(link.href);
        copy.textContent = "Copied!";
      } catch {
        copy.textContent = "Copy unavailable";
      }
    };

    row.append(link, path, copy);
    fileBox.appendChild(row);
  });

  status.textContent = files.length + " HTML files found.";
}

search.addEventListener("input", () => {
  const keyword = search.value.toLowerCase();

  const filtered = allFiles.filter(file =>
    file.path.toLowerCase().includes(keyword)
  );

  renderFiles(filtered);
});

loadFiles();
</script>

</body>
</html>
